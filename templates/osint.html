{% extends "base.html" %}

{% block title %}VulnX | OSINT Reconnaissance{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/osint.css') }}">

<div class="osint-container">
    <div class="osint-header">
        <h2>OSINT RECON</h2>
        <p>Run domain WHOIS, DNS resolution, IP intelligence, and technology detection in one scan.</p>
    </div>

    <form class="unified-osint-search" id="unifiedOsintForm">
        <label for="unifiedOsintTarget">Target URL / Domain</label>
        <input type="text" id="unifiedOsintTarget" placeholder="Enter domain or URL (e.g., example.com/login)" autocomplete="off" required>
        <button id="startUnifiedOsint" type="submit">START OSINT SCAN</button>
        <p id="unifiedOsintMessage" class="unified-osint-message" role="status"></p>
    </form>
    <div id="unifiedOsintProgress" class="unified-osint-progress" aria-live="polite"></div>
    <div id="unifiedOsintResults" class="unified-osint-results" aria-live="polite"></div>

</div>

<script src="{{ url_for('static', filename='js/osint.js') }}"></script>
{% endblock %}
